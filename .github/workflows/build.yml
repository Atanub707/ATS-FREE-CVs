name: Build Standalone Executables

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --loglevel=warn --no-audit --no-fund
      - run: npx vite build
      - run: npx esbuild server.ts --bundle --platform=node --format=cjs --outfile=dist/bundle.cjs
      - run: node --experimental-sea-config sea-config.json
      - run: |
          cp $(which node) dist/ats-cv-tailor-linux
          chmod +x dist/ats-cv-tailor-linux
          npx postject dist/ats-cv-tailor-linux NODE_SEA_BLOB dist/sea.blob \
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/ats-cv-tailor-linux
          token: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --loglevel=warn --no-audit --no-fund
      - run: npx vite build
      - run: npx esbuild server.ts --bundle --platform=node --format=cjs --outfile=dist/bundle.cjs
      - run: node --experimental-sea-config sea-config.json
      - run: |
          cp $(which node) dist/ats-cv-tailor-macos
          chmod +x dist/ats-cv-tailor-macos
          npx postject dist/ats-cv-tailor-macos NODE_SEA_BLOB dist/sea.blob \
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2 \
            --macho-segment-name NODE_SEA
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/ats-cv-tailor-macos

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --loglevel=warn --no-audit --no-fund
      - run: npx vite build
        shell: pwsh
      - run: npx esbuild server.ts --bundle --platform=node --format=cjs --outfile=dist/bundle.cjs
        shell: pwsh
      - run: node --experimental-sea-config sea-config.json
        shell: pwsh
      - name: Build executable
        shell: pwsh
        run: |
          Copy-Item (Get-Command node).Source dist\ats-cv-tailor-windows.exe
          npx postject dist\ats-cv-tailor-windows.exe NODE_SEA_BLOB dist\sea.blob `
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
      - uses: softprops/action-gh-release@v2
        with:
          files: dist\ats-cv-tailor-windows.exe