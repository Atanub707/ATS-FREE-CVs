name: Build Standalone Executables

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --loglevel=error

      - name: Build frontend
        run: npx vite build

      - name: Bundle server
        run: npx esbuild server.ts --bundle --platform=node --format=cjs --packages=internal --outfile=dist/bundle.cjs

      - name: Create SEA blob
        run: node --experimental-sea-config sea-config.json

      - name: Build executable (Linux)
        if: runner.os == 'Linux'
        run: |
          cp $(which node) dist/ats-cv-tailor-linux
          npx postject dist/ats-cv-tailor-linux NODE_SEA_BLOB dist/sea.blob \
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2

      - name: Build executable (macOS)
        if: runner.os == 'macOS'
        run: |
          cp $(which node) dist/ats-cv-tailor-macos
          npx postject dist/ats-cv-tailor-macos NODE_SEA_BLOB dist/sea.blob \
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2 \
            --macho-segment-name NODE_SEA
          chmod +x dist/ats-cv-tailor-macos

      - name: Build executable (Windows)
        if: runner.os == 'Windows'
        run: |
          copy "%ProgramFiles%\nodejs\node.exe" dist\ats-cv-tailor-windows.exe
          npx postject dist\ats-cv-tailor-windows.exe NODE_SEA_BLOB dist\sea.blob ^
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/ats-cv-tailor-*
