name: CI Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write
  security-events: write
  actions: read

jobs:
  # ──────────────────── SECURITY STAGE ────────────────────
  secrets:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: npm Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: npm audit (fail on high+critical)
        run: npm audit --audit-level=high
      - name: Check allowed exceptions
        run: |
          if [ -f .npm-audit-allowlist ]; then
            echo "Known exceptions:"
            cat .npm-audit-allowlist
          fi

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --loglevel=warn --no-audit --no-fund
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3

  trivy:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t ats-cv-tailor .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ats-cv-tailor
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true
      - name: Check Trivy exceptions
        run: |
          if [ -f .trivyignore ]; then
            echo "Ignored CVEs (documented exceptions):"
            cat .trivyignore
          fi
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  # ──────────────────── BUILD STAGE ────────────────────
  # Runs only if all security jobs pass AND this is a version tag push
  build-linux:
    needs: [secrets, audit, codeql, trivy]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --loglevel=warn --no-audit --no-fund
      - run: npx vite build
      - run: npx esbuild server.ts --bundle --platform=node --format=cjs --external:fsevents --external:lightningcss --external:@tailwindcss/oxide --external:@napi-rs/canvas --outfile=dist/bundle.cjs 2>&1 || true
      - run: cp -r node_modules/fsevents node_modules/lightningcss node_modules/@tailwindcss/oxide node_modules/@napi-rs/canvas dist/ 2>/dev/null || true
      - run: node --experimental-sea-config sea-config.json
      - run: |
          cp $(which node) dist/ats-cv-tailor-linux
          chmod +x dist/ats-cv-tailor-linux
          npx postject dist/ats-cv-tailor-linux NODE_SEA_BLOB dist/sea.blob \
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/ats-cv-tailor-linux
          token: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    needs: [secrets, audit, codeql, trivy]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --loglevel=warn --no-audit --no-fund
      - run: npx vite build
      - run: npx esbuild server.ts --bundle --platform=node --format=cjs --external:fsevents --external:lightningcss --external:@tailwindcss/oxide --external:@napi-rs/canvas --outfile=dist/bundle.cjs 2>&1 || true
      - run: cp -r node_modules/fsevents node_modules/lightningcss node_modules/@tailwindcss/oxide node_modules/@napi-rs/canvas dist/ 2>/dev/null || true
      - run: node --experimental-sea-config sea-config.json
      - run: |
          cp $(which node) dist/ats-cv-tailor-macos
          chmod +x dist/ats-cv-tailor-macos
          npx postject dist/ats-cv-tailor-macos NODE_SEA_BLOB dist/sea.blob \
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2 \
            --macho-segment-name NODE_SEA
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/ats-cv-tailor-macos
          token: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    needs: [secrets, audit, codeql, trivy]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --loglevel=warn --no-audit --no-fund
      - run: npx vite build
        shell: pwsh
      - run: npx esbuild server.ts --bundle --platform=node --format=cjs --external:fsevents --external:lightningcss --external:@tailwindcss/oxide --external:@napi-rs/canvas --outfile=dist/bundle.cjs 2>&1; Exit(0)
        shell: pwsh
      - run: node --experimental-sea-config sea-config.json
        shell: pwsh
      - name: Build executable
        shell: pwsh
        run: |
          Copy-Item (Get-Command node).Source dist\ats-cv-tailor-windows.exe
          npx postject dist\ats-cv-tailor-windows.exe NODE_SEA_BLOB dist\sea.blob `
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
      - uses: softprops/action-gh-release@v2
        with:
          files: dist\ats-cv-tailor-windows.exe
          token: ${{ secrets.GITHUB_TOKEN }}

  docker:
    needs: [secrets, audit, codeql, trivy]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase repo
        id: repo
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$OWNER/$REPO" >> $GITHUB_OUTPUT
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ steps.repo.outputs.image }}:latest,${{ steps.repo.outputs.image }}:${{ github.ref_name }}
