<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Recruiters — Identity Card Mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4F6FA; --card: #FFFFFF; --border: #E4E9F1; --text: #0B1220;
    --muted: #5B6472; --faint: #97A0AE; --blue: #2563EB; --blue-soft: #EFF4FF;
    --blue-border: #C7D8FB; --linkedin: #0A66C2; --linkedin-soft: #F0F6FD;
    --green: #15803D; --green-soft: #ECF7F0; --green-border: #C3E6D0;
    --amber: #B45309; --amber-soft: #FEF6E7; --amber-border: #F5DCA8;
    --red: #DC2626; --red-soft: #FEF2F2; --purple: #7C3AED; --purple-soft: #F5F3FF;
    --shadow: 0 1px 2px rgba(11,18,32,.05);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }

  /* ── Header ── */
  .hdr { display: flex; align-items: center; gap: 12px; padding: 0 28px; height: 60px; border-bottom: 1px solid var(--border); background: var(--card); flex-shrink: 0; }
  .back { display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--muted); font-size: 12.5px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .back:hover { color: var(--text); border-color: var(--blue-border); background: var(--blue-soft); }
  .hdr .ttl b { font-size: 15px; font-weight: 700; display: block; line-height: 1.2; }
  .hdr .ttl span { font-size: 11px; color: var(--faint); font-weight: 500; }
  .spacer { flex: 1; }
  .count-pill { font-size: 12px; font-weight: 700; color: var(--blue); background: var(--blue-soft); border: 1px solid var(--blue-border); padding: 6px 13px; border-radius: 20px; }

  /* ── Content ── */
  .wrap { max-width: 1360px; width: 100%; margin: 0 auto; padding: 22px 28px 36px; flex: 1; display: flex; flex-direction: column; gap: 14px; }
  .toolbar { display: flex; gap: 10px; align-items: center; }
  .search { flex: 1; display: flex; align-items: center; gap: 9px; height: 40px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 0 13px; color: var(--faint); }
  .search:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,.09); }
  .search input { flex: 1; border: 0; outline: none; background: none; font-size: 13px; font-family: inherit; color: var(--text); }
  .search input::placeholder { color: var(--faint); }
  .search svg { width: 14px; height: 14px; }
  .fselect { height: 40px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); color: var(--muted); font-size: 12.5px; font-weight: 600; font-family: inherit; padding: 0 10px; outline: none; cursor: pointer; }

  /* ── Identity card grid ── */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; align-content: start; }
  .idcard { background: var(--card); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 10px; transition: box-shadow .15s ease, transform .15s ease; position: relative; }
  .idcard:hover { box-shadow: 0 6px 18px -6px rgba(11,18,32,.14); transform: translateY(-1px); }

  /* identity row: photo | name+email */
  .idrow { display: flex; align-items: center; gap: 12px; }
  .photo { width: 58px; height: 58px; border-radius: 12px; background: linear-gradient(135deg, #E2E8F0, #CBD5E1); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: #64748B; flex-shrink: 0; overflow: hidden; }
  .photo .cam { width: 20px; height: 20px; opacity: .55; }
  .photo.has { background: linear-gradient(135deg, #2563EB, #7C3AED); color: #fff; font-weight: 800; font-size: 22px; border: 0; }
  .photo.has.alt1 { background: linear-gradient(135deg, #F59E0B, #EF4444); }
  .photo.has.alt2 { background: linear-gradient(135deg, #10B981, #0EA5E9); }
  .idmain { min-width: 0; flex: 1; }
  .idmain .nm { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .idmain .nm b { font-size: 13.5px; font-weight: 700; letter-spacing: -.01em; }
  .tag { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 2px 7px; border-radius: 20px; }
  .tag.recruit { background: var(--blue-soft); color: var(--blue); border: 1px solid var(--blue-border); }
  .tag.hr { background: var(--amber-soft); color: var(--amber); border: 1px solid var(--amber-border); }
  .tag.company { background: #F1F5F9; color: var(--muted); border: 1px solid var(--border); }
  .idmain .mail { font-size: 11.5px; color: var(--muted); margin-top: 3px; display: flex; align-items: center; gap: 6px; min-width: 0; }
  .idmain .mail code { font-family: ui-monospace, Menlo, monospace; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; font-size: 10.5px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  .idmain .mail .none { color: var(--faint); font-size: 10.5px; font-style: italic; }

  /* contact chips row */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 600; border-radius: 7px; padding: 3px 8px; border: 1px solid var(--border); color: var(--muted); background: #fff; text-decoration: none; }
  .chip.phone { color: var(--purple); border-color: #E9D5FF; background: var(--purple-soft); }
  .chip.whatsapp { color: #15803D; border-color: var(--green-border); background: var(--green-soft); }
  .chip.linkedin { color: var(--linkedin); border-color: #B9D0EF; background: var(--linkedin-soft); }
  .chip svg { width: 11px; height: 11px; }
  .chip .none { color: var(--faint); font-style: italic; }

  /* meta row: company · role · jobs */
  .meta { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--faint); min-width: 0; flex-wrap: wrap; }
  .meta .co { font-weight: 600; color: var(--muted); }
  .meta .sep { color: #D3DAE4; }
  .meta .jobs { color: var(--green); font-weight: 700; background: var(--green-soft); border: 1px solid var(--green-border); padding: 1px 7px; border-radius: 20px; font-size: 10px; }
  .meta .role { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }

  /* context */
  .ctx { font-size: 10.5px; color: var(--faint); font-style: italic; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 31px; }

  /* card footer */
  .cact { display: flex; align-items: center; gap: 7px; margin-top: auto; padding-top: 9px; border-top: 1px dashed var(--border); }
  .cbtn { display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 11px; border-radius: 8px; border: 1px solid var(--border); background: #fff; color: var(--muted); font-size: 11px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all .15s ease; text-decoration: none; }
  .cbtn:hover { border-color: var(--blue-border); color: var(--blue); }
  .cbtn.copied { border-color: var(--green-border); color: var(--green); background: var(--green-soft); }
  .cbtn.ghost { border: 0; background: transparent; padding: 0 5px; margin-left: auto; color: var(--faint); }
  .cbtn.ghost:hover { color: var(--red); background: var(--red-soft); }
  .cbtn svg { width: 12px; height: 12px; }

  /* ── Sticky bar ── */
  .actbar { position: sticky; bottom: 0; background: rgba(255,255,255,.94); backdrop-filter: blur(12px); border-top: 1px solid var(--border); padding: 12px 28px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .actbar .note { font-size: 11.5px; color: var(--faint); }
  .actbar .spacer { flex: 1; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 18px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all .15s ease; }
  .btn:hover { border-color: var(--blue-border); }
  .btn.primary { background: linear-gradient(135deg, #2563EB, #1D4ED8); border-color: transparent; color: #fff; box-shadow: 0 2px 6px rgba(37,99,235,.3); }
  .btn.primary:hover { filter: brightness(1.07); }
  .btn.copied { background: var(--green-soft); border-color: var(--green-border); color: var(--green); }
  .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: var(--text); color: #F8FAFC; font-size: 12.5px; font-weight: 600; padding: 11px 18px; border-radius: 12px; display: flex; align-items: center; gap: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.3); z-index: 50; opacity: 0; transition: opacity .25s ease; }
  .toast.show { opacity: 1; }

  .empty { display: none; text-align: center; padding: 60px 20px; }
  .empty.show { display: block; }
</style>
</head>
<body>

<header class="hdr">
  <button class="back">← Back</button>
  <div class="ttl"><b>Recruiters</b><span>Identity cards — emails, phones & LinkedIn from job descriptions.</span></div>
  <div class="spacer"></div>
  <span class="count-pill" id="countPill">14 contacts</span>
</header>

<div class="wrap">
  <div class="toolbar">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="searchInput" placeholder="Search name, email, company…" />
    </div>
    <select class="fselect" id="companyFilter"><option value="">All companies</option></select>
  </div>

  <div class="grid" id="grid"></div>

  <div class="empty" id="empty">
    <b>No contacts match</b>
    <p style="color:var(--faint);font-size:12.5px;margin-top:5px">Try a different search or clear the filters.</p>
  </div>
</div>

<div class="actbar">
  <span class="note">Cards fill the screen — no long scrolling. Click any chip to copy.</span>
  <div class="spacer"></div>
  <button class="btn">Close</button>
  <button class="btn primary" id="copyAll">Copy all emails</button>
</div>

<div class="toast" id="toast"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg><span id="toastText">Copied</span></div>

<script>
  // Real-ish sample data modeled on the live channel
  const DATA = [
    { id: 1, name: 'Edward Laing', email: 'edward@isr.uk.com', phone: '07436 071 872', wa: null, li: 'https://www.linkedin.com/in/edwardlaing', company: 'ISR Recruitment', role: 'DevSecOps Engineer', jobs: 8, tag: 'recruit', ctx: 'Edward Laing, Senior Recruiter — "Reach out directly"' },
    { id: 2, name: null, email: 'adam.rees@identifysolutions.co.uk', phone: '07400 28 3333', wa: null, li: null, company: 'Identify Solutions', role: 'DevOps Engineer', jobs: 3, tag: 'recruit', ctx: 'Adam Rees — "Contact for application questions"' },
    { id: 3, name: 'Rob Sheard', email: null, phone: null, wa: null, li: 'https://www.linkedin.com/in/robsheard', company: 'CGI', role: 'Platform Engineer (DevOps)', jobs: 1, tag: 'recruit', ctx: 'Recruiter for CGI Platform Engineer role' },
    { id: 4, name: null, email: 'rt@skillsearch.com', phone: null, wa: '+44 7700 900123', li: null, company: 'Skillsearch', role: 'DevSecOps Engineer', jobs: 2, tag: 'recruit', ctx: 'Skillsearch recruitment — reachable via email or WhatsApp' },
    { id: 5, name: 'Tanja Kaysen', email: 'tanja.kaysen@wecompare.dk', phone: '93 83 83 54', wa: null, li: 'https://www.linkedin.com/in/tanjakaysen', company: 'We Compare', role: 'Vulnerability & Security Specialist', jobs: 1, tag: 'recruit', ctx: 'Tanja Kaysen, Founder & Trusted Advisor' },
    { id: 6, name: null, email: 'careers@denari.ai', phone: null, wa: null, li: null, company: 'Denari', role: 'Multiple roles', jobs: 2, tag: 'company', ctx: 'Careers inbox' },
    { id: 7, name: 'Sofia Lindberg', email: null, phone: '+45 61 23 45 67', wa: '+45 61 23 45 67', li: 'https://www.linkedin.com/in/sofialindberg', company: 'Insero Air Traffic Solutions', role: 'Vulnerability & Security Specialist', jobs: 1, tag: 'hr', ctx: 'Sofia Lindberg, Talent Partner' },
    { id: 8, name: null, email: 'accessible.recruiting@prima.it', phone: null, wa: null, li: null, company: 'Prima', role: 'Software Engineer', jobs: 1, tag: 'hr', ctx: 'Accessible recruiting contact' },
    { id: 9, name: null, email: 'emsom@airbus.com', phone: null, wa: null, li: null, company: 'Airbus', role: 'Platform Engineer', jobs: 1, tag: 'company', ctx: 'Direct contact from description' },
    { id: 10, name: 'Marcus Reid', email: 'marcus.reid@harmonyhealthit.com', phone: '0973725006', wa: '0973725006', li: 'https://www.linkedin.com/in/marcusreid', company: 'Harmony Healthcare IT', role: 'AWS DevOps Engineer', jobs: 1, tag: 'recruit', ctx: 'Marcus Reid, Technical Recruiter' },
    { id: 11, name: null, email: 'join@clearroute.io', phone: null, wa: null, li: null, company: 'ClearRoute', role: 'DevOps Engineer', jobs: 1, tag: 'company', ctx: 'Join inbox' },
    { id: 12, name: null, email: 'hr@expleogroup.com', phone: '020 7780 6706', wa: null, li: null, company: 'Expleo Group', role: 'DevSecOps Engineer', jobs: 3, tag: 'hr', ctx: 'HR department' },
  ];

  const AV = ['has', 'has alt1', 'has alt2'];
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const countPill = document.getElementById('countPill');
  const companies = [...new Set(DATA.map(c => c.company))].sort();
  companies.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; companyFilter.appendChild(o); });

  const ICONS = {
    mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/></svg>',
    phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>',
    wa: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.52.149-.174.198-.298.297-.497.1-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z"/></svg>',
    li: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>',
    cam: '<svg class="cam" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>',
  };

  function card(c, i) {
    const initial = (c.name || c.email?.[0] || c.phone?.[0] || '?').charAt(0).toUpperCase();
    const hasName = !!c.name;
    const el = document.createElement('div');
    el.className = 'idcard';
    el.innerHTML = `
      <div class="idrow">
        <div class="photo ${hasName ? AV[i % 3] : ''}">${hasName ? initial : ICONS.cam}</div>
        <div class="idmain">
          <div class="nm"><b>${c.name || 'Unnamed contact'}</b><span class="tag ${c.tag}">${c.tag === 'recruit' ? 'Recruiting' : c.tag === 'hr' ? 'HR' : 'Company'}</span></div>
          <div class="mail">${c.email ? '<code>' + c.email + '</code>' : '<span class="none">no email</span>'}</div>
        </div>
      </div>
      <div class="chips">
        ${c.email ? '<span class="chip" data-copy="' + c.email + '">' + ICONS.mail + ' Email</span>' : ''}
        ${c.phone ? '<span class="chip phone" data-copy="' + c.phone + '">' + ICONS.phone + ' ' + c.phone + '</span>' : ''}
        ${c.wa ? '<span class="chip whatsapp" data-copy="' + c.wa + '">' + ICONS.wa + ' WhatsApp</span>' : ''}
        ${c.li ? '<a class="chip linkedin" href="' + c.li + '" target="_blank" rel="noreferrer">' + ICONS.li + ' LinkedIn</a>' : ''}
        ${!c.email && !c.phone && !c.wa && !c.li ? '<span class="chip"><span class="none">no contact details</span></span>' : ''}
      </div>
      <div class="meta">
        <span class="co">${c.company}</span><span class="sep">·</span><span class="role">${c.role}</span>
        <span class="jobs">${c.jobs} job${c.jobs > 1 ? 's' : ''}</span>
      </div>
      <div class="ctx">"${c.ctx}"</div>
      <div class="cact">
        <button class="cbtn copy">Copy</button>
        <button class="cbtn ghost">✕</button>
      </div>`;
    el.querySelector('.copy').addEventListener('click', (e) => {
      const copyTarget = c.email || c.phone || c.wa || c.li || '';
      navigator.clipboard.writeText(copyTarget);
      const b = e.currentTarget;
      b.textContent = 'Copied ✓';
      b.classList.add('copied');
      setTimeout(() => { b.textContent = 'Copy'; b.classList.remove('copied'); }, 1300);
      toast((c.name || copyTarget) + ' — copied');
    });
    el.querySelector('.ghost').addEventListener('click', () => { el.style.display = 'none'; render(); });
    return el;
  }

  function render() {
    const q = searchInput.value.trim().toLowerCase();
    const comp = companyFilter.value;
    const visible = DATA.filter(c =>
      !c.hidden &&
      (!comp || c.company === comp) &&
      (!q || (c.name || '').toLowerCase().includes(q) || (c.email || '').toLowerCase().includes(q) || (c.phone || '').includes(q) || c.company.toLowerCase().includes(q))
    );
    countPill.textContent = visible.length + ' contact' + (visible.length === 1 ? '' : 's');
    empty.classList.toggle('show', visible.length === 0);
    grid.innerHTML = '';
    visible.forEach((c, i) => grid.appendChild(card(c, i)));
  }

  let toastT;
  function toast(t) { document.getElementById('toastText').textContent = t; const el = document.getElementById('toast'); el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 1800); }

  searchInput.addEventListener('input', render);
  companyFilter.addEventListener('change', render);
  document.getElementById('copyAll').addEventListener('click', () => {
    const emails = DATA.filter(c => !c.hidden && c.email).map(c => c.email);
    navigator.clipboard.writeText(emails.join('\n'));
    toast(emails.length + ' emails copied');
  });

  render();
</script>
</body>
</html>
