<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <style>
      @keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:1} }
      @keyframes slideIn { from{transform:translateX(-20px);opacity:0} to{transform:translateX(0);opacity:1} }
      @keyframes fadeIn { from{opacity:0} to{opacity:1} }
      @keyframes barGrow { from{width:0} to{width:100%} }
      .pulse{animation:pulse 2s ease-in-out infinite}
      .slide1{animation:slideIn 0.6s ease-out 0.1s both}
      .slide2{animation:slideIn 0.6s ease-out 0.3s both}
      .slide3{animation:slideIn 0.6s ease-out 0.5s both}
      .fade{animation:fadeIn 1s ease-out 0.8s both}
      .bar{animation:barGrow 1.5s ease-out 1s both;transform-origin:left}
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.04">
    <line x1="0" y1="80" x2="1200" y2="80" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="1200" y2="160" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="320" x2="1200" y2="320" stroke="#fff" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="400" stroke="#fff" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="400" stroke="#fff" stroke-width="0.5"/>
    <line x1="900" y1="0" x2="900" y2="400" stroke="#fff" stroke-width="0.5"/>
  </g>

  <!-- Dashboard UI Mockup (Left) -->
  <g filter="url(#shadow)" class="slide1">
    <rect x="50" y="50" width="380" height="300" rx="12" fill="url(#card)" stroke="#334155" stroke-width="1"/>
    
    <!-- Header bar -->
    <rect x="50" y="50" width="380" height="40" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="50" y="74" width="380" height="16" fill="#1e293b"/>
    <circle cx="70" cy="70" r="10" fill="#3b82f6" opacity="0.6"/>
    <rect x="90" y="65" width="80" height="4" rx="2" fill="#475569"/>
    <rect x="90" y="73" width="50" height="3" rx="1.5" fill="#64748b"/>

    <!-- Metric cards -->
    <rect x="65" y="100" width="105" height="50" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <rect x="75" y="110" width="30" height="3" rx="1.5" fill="#64748b"/>
    <rect x="75" y="135" width="35" height="4" rx="2" fill="#3b82f6"/>
    <rect x="185" y="100" width="105" height="50" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <rect x="195" y="110" width="35" height="3" rx="1.5" fill="#64748b"/>
    <rect x="195" y="135" width="35" height="4" rx="2" fill="#8b5cf6"/>
    <rect x="305" y="100" width="105" height="50" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <rect x="315" y="110" width="25" height="3" rx="1.5" fill="#64748b"/>
    <rect x="315" y="135" width="35" height="4" rx="2" fill="#10b981"/>

    <!-- Search bar -->
    <rect x="65" y="168" width="350" height="28" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <circle cx="80" cy="182" r="3" fill="#475569"/>
    <rect x="90" y="180" width="90" height="4" rx="2" fill="#334155"/>

    <!-- Job rows -->
    <rect x="65" y="208" width="350" height="34" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <rect x="75" y="218" width="60" height="4" rx="2" fill="#3b82f6" opacity="0.7"/>
    <rect x="75" y="226" width="140" height="3" rx="1.5" fill="#64748b"/>
    <rect x="330" y="216" width="65" height="16" rx="4" fill="#3b82f6" opacity="0.2"/>
    <rect x="340" y="220" width="45" height="8" rx="4" fill="#3b82f6"/>

    <rect x="65" y="250" width="350" height="34" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <rect x="75" y="260" width="50" height="4" rx="2" fill="#10b981" opacity="0.7"/>
    <rect x="75" y="268" width="160" height="3" rx="1.5" fill="#64748b"/>
    <rect x="330" y="258" width="65" height="16" rx="4" fill="#10b981" opacity="0.2"/>
    <rect x="340" y="262" width="45" height="8" rx="4" fill="#10b981"/>

    <rect x="65" y="292" width="350" height="34" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <rect x="75" y="302" width="55" height="4" rx="2" fill="#8b5cf6" opacity="0.7"/>
    <rect x="75" y="310" width="120" height="3" rx="1.5" fill="#64748b"/>
    <rect x="330" y="300" width="65" height="16" rx="4" fill="#8b5cf6" opacity="0.2"/>
    <rect x="340" y="304" width="45" height="8" rx="4" fill="#8b5cf6"/>
  </g>

  <!-- Right panel: text -->
  <g class="slide2">
    <text x="480" y="95" fill="#3b82f6" font-family="monospace" font-size="12" font-weight="600" letter-spacing="2">ATS CV TAILOR</text>
    
    <text x="480" y="140" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.5">
      From Job Search
    </text>
    <text x="480" y="178" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.5">
      to Tailored CV
    </text>

    <rect x="480" y="198" width="50" height="3" rx="1.5" fill="url(#accent)"/>

    <text x="480" y="230" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" line-height="1.5">
      <tspan x="480" dy="0">Multi-source job scraper, AI-powered ATS</tspan>
      <tspan x="480" dy="20">matching, and CV tailoring — all running</tspan>
      <tspan x="480" dy="20">locally on your machine.</tspan>
    </text>
  </g>

  <!-- Feature blocks -->
  <g class="slide3">
    <rect x="480" y="265" width="170" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <rect x="492" y="275" width="20" height="20" rx="4" fill="#3b82f6"/>
    <text x="520" y="287" fill="#f1f5f9" font-family="system-ui" font-size="11" font-weight="600">8 Job Sources</text>
    <text x="520" y="302" fill="#64748b" font-family="system-ui" font-size="10">LinkedIn · Dice · Reed · more</text>

    <rect x="665" y="265" width="170" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <rect x="677" y="275" width="20" height="20" rx="4" fill="#10b981"/>
    <text x="705" y="287" fill="#f1f5f9" font-family="system-ui" font-size="11" font-weight="600">AI ATS Scoring</text>
    <text x="705" y="302" fill="#64748b" font-family="system-ui" font-size="10">Smart match vs your profile</text>

    <rect x="480" y="325" width="170" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <rect x="492" y="335" width="20" height="20" rx="4" fill="#8b5cf6"/>
    <text x="520" y="347" fill="#f1f5f9" font-family="system-ui" font-size="11" font-weight="600">CV Tailoring</text>
    <text x="520" y="362" fill="#64748b" font-family="system-ui" font-size="10">ATS .docx · .pdf · .txt export</text>

    <rect x="665" y="325" width="170" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <rect x="677" y="335" width="20" height="20" rx="4" fill="#f59e0b"/>
    <text x="705" y="347" fill="#f1f5f9" font-family="system-ui" font-size="11" font-weight="600">Local & Private</text>
    <text x="705" y="362" fill="#64748b" font-family="system-ui" font-size="10">Runs on your machine</text>
  </g>

  <!-- Tech badges -->
  <g class="fade">
    <rect x="480" y="388" width="55" height="18" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <text x="507" y="400" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">React</text>
    <rect x="543" y="388" width="55" height="18" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <text x="570" y="400" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">TypeScript</text>
    <rect x="606" y="388" width="55" height="18" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <text x="633" y="400" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Express</text>
    <rect x="669" y="388" width="55" height="18" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <text x="696" y="400" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Tailwind</text>
    <rect x="732" y="388" width="55" height="18" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <text x="759" y="400" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Gemini</text>
  </g>

  <!-- Animated progress bar at bottom -->
  <rect x="480" y="378" width="320" height="2" rx="1" fill="#1e293b"/>
  <rect x="480" y="378" width="0" height="2" rx="1" fill="url(#accent)" class="bar"/>
</svg>
